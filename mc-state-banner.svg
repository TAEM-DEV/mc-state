<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" width="900" height="220">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="100%" style="stop-color:#161b22"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f0883e"/>
      <stop offset="100%" style="stop-color:#e3b341"/>
    </linearGradient>
    <linearGradient id="pulse-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f0883e;stop-opacity:0"/>
      <stop offset="50%" style="stop-color:#e3b341;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#f0883e;stop-opacity:0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-strong">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="clip"><rect width="900" height="220" rx="12"/></clipPath>
  </defs>

  <!-- Background -->
  <g clip-path="url(#clip)">
    <rect width="900" height="220" fill="url(#bg)"/>

    <!-- Subtle grid lines -->
    <g opacity="0.04" stroke="#f0f6fc" stroke-width="0.5">
      <line x1="0" y1="0" x2="0" y2="220"/><line x1="40" y1="0" x2="40" y2="220"/>
      <line x1="80" y1="0" x2="80" y2="220"/><line x1="120" y1="0" x2="120" y2="220"/>
      <line x1="160" y1="0" x2="160" y2="220"/><line x1="200" y1="0" x2="200" y2="220"/>
      <line x1="240" y1="0" x2="240" y2="220"/><line x1="280" y1="0" x2="280" y2="220"/>
      <line x1="320" y1="0" x2="320" y2="220"/><line x1="360" y1="0" x2="360" y2="220"/>
      <line x1="400" y1="0" x2="400" y2="220"/><line x1="440" y1="0" x2="440" y2="220"/>
      <line x1="480" y1="0" x2="480" y2="220"/><line x1="520" y1="0" x2="520" y2="220"/>
      <line x1="560" y1="0" x2="560" y2="220"/><line x1="600" y1="0" x2="600" y2="220"/>
      <line x1="640" y1="0" x2="640" y2="220"/><line x1="680" y1="0" x2="680" y2="220"/>
      <line x1="720" y1="0" x2="720" y2="220"/><line x1="760" y1="0" x2="760" y2="220"/>
      <line x1="800" y1="0" x2="800" y2="220"/><line x1="840" y1="0" x2="840" y2="220"/>
      <line x1="880" y1="0" x2="880" y2="220"/>
      <line x1="0" y1="40" x2="900" y2="40"/><line x1="0" y1="80" x2="900" y2="80"/>
      <line x1="0" y1="120" x2="900" y2="120"/><line x1="0" y1="160" x2="900" y2="160"/>
      <line x1="0" y1="200" x2="900" y2="200"/>
    </g>

    <!-- Git Branch Icon (left side) -->
    <g transform="translate(60, 30)">
      <!-- Main vertical line -->
      <line x1="40" y1="15" x2="40" y2="155" stroke="#f0883e" stroke-width="2.5" opacity="0.7"/>
      <!-- Branch line splitting off -->
      <path d="M40,70 C40,70 55,70 70,55" stroke="#f0883e" stroke-width="2" fill="none" opacity="0.5"/>
      <line x1="70" y1="55" x2="70" y2="25" stroke="#f0883e" stroke-width="2" opacity="0.5"/>

      <!-- Commit circles on main line -->
      <circle cx="40" cy="25" r="5" fill="#0d1117" stroke="#f0883e" stroke-width="2" filter="url(#glow)"/>
      <circle cx="40" cy="65" r="5" fill="#0d1117" stroke="#f0883e" stroke-width="2" filter="url(#glow)"/>
      <circle cx="40" cy="105" r="5" fill="#0d1117" stroke="#f0883e" stroke-width="2" filter="url(#glow)"/>
      <circle cx="40" cy="145" r="5" fill="#0d1117" stroke="#f0883e" stroke-width="2" filter="url(#glow)"/>

      <!-- Branch commit -->
      <circle cx="70" cy="30" r="4" fill="#0d1117" stroke="#f0883e" stroke-width="1.5" opacity="0.6"/>

      <!-- Animated dot traveling down main line -->
      <circle cx="40" r="3" fill="#e3b341" filter="url(#glow-strong)" opacity="0.9">
        <animate attributeName="cy" values="15;145;15" dur="3s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.3;1;0.3" dur="3s" repeatCount="indefinite"/>
      </circle>

      <!-- Second animated dot (staggered) -->
      <circle cx="40" r="2.5" fill="#f0883e" filter="url(#glow)" opacity="0.7">
        <animate attributeName="cy" values="145;15;145" dur="4s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.2;0.8;0.2" dur="4s" repeatCount="indefinite"/>
      </circle>

      <!-- Animated dot on branch -->
      <circle cx="70" r="2" fill="#e3b341" filter="url(#glow)" opacity="0.6">
        <animate attributeName="cy" values="55;30;55" dur="2.5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.2;0.7;0.2" dur="2.5s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- Divider line -->
    <line x1="160" y1="20" x2="160" y2="155" stroke="#f0883e" stroke-width="1" opacity="0.15"/>

    <!-- Title -->
    <text x="185" y="60" font-family="'SF Mono', 'Fira Code', 'Cascadia Code', 'JetBrains Mono', monospace" font-size="42" font-weight="bold" fill="#f0f6fc" filter="url(#glow)">mc-state</text>

    <!-- Tagline -->
    <text x="185" y="85" font-family="'SF Mono', 'Fira Code', 'Cascadia Code', 'JetBrains Mono', monospace" font-size="14" fill="#8b949e">Git-first mission state store  &#x2022;  v0.0.1</text>

    <!-- Orange accent bar with animated width -->
    <rect x="185" y="97" height="3" rx="1.5" fill="url(#accent)" opacity="0.8">
      <animate attributeName="width" from="0" to="460" dur="1.2s" fill="freeze" calcMode="spline" keySplines="0.25 0.1 0.25 1"/>
    </rect>

    <!-- Feature pills row -->
    <g transform="translate(185, 115)">
      <!-- JSONL Signals (orange) -->
      <rect x="0" y="0" width="120" height="26" rx="13" fill="#f0883e" fill-opacity="0.2" stroke="#9e6a03" stroke-width="1"/>
      <text x="60" y="17" font-family="'SF Mono', 'Fira Code', 'Cascadia Code', 'JetBrains Mono', monospace" font-size="11" fill="#e3b341" text-anchor="middle">JSONL Signals</text>

      <!-- Phase Gates (blue) -->
      <rect x="132" y="0" width="104" height="26" rx="13" fill="#1f6feb" fill-opacity="0.15" stroke="#1f6feb" stroke-width="1"/>
      <text x="184" y="17" font-family="'SF Mono', 'Fira Code', 'Cascadia Code', 'JetBrains Mono', monospace" font-size="11" fill="#58a6ff" text-anchor="middle">Phase Gates</text>

      <!-- Append-Only (green) -->
      <rect x="248" y="0" width="108" height="26" rx="13" fill="#238636" fill-opacity="0.15" stroke="#238636" stroke-width="1"/>
      <text x="302" y="17" font-family="'SF Mono', 'Fira Code', 'Cascadia Code', 'JetBrains Mono', monospace" font-size="11" fill="#3fb950" text-anchor="middle">Append-Only</text>

      <!-- Git Audit Trail (purple) -->
      <rect x="368" y="0" width="126" height="26" rx="13" fill="#6e40c9" fill-opacity="0.15" stroke="#6e40c9" stroke-width="1"/>
      <text x="431" y="17" font-family="'SF Mono', 'Fira Code', 'Cascadia Code', 'JetBrains Mono', monospace" font-size="11" fill="#bc8cff" text-anchor="middle">Git Audit Trail</text>
    </g>

    <!-- Bottom architecture bar -->
    <rect x="0" y="170" width="900" height="50" fill="#161b22"/>
    <line x1="0" y1="170" x2="900" y2="170" stroke="#f0883e" stroke-width="0.5" opacity="0.15"/>

    <!-- Architecture flow text with pulsing dots -->
    <g transform="translate(30, 198)">
      <!-- Pulsing dot 1 -->
      <circle cx="0" cy="-4" r="3.5" fill="#f0883e" filter="url(#glow)">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/>
      </circle>
      <text x="12" font-family="'SF Mono', 'Fira Code', 'Cascadia Code', 'JetBrains Mono', monospace" font-size="12" fill="#8b949e">Kernel</text>

      <text x="82" font-family="'SF Mono', 'Fira Code', 'Cascadia Code', 'JetBrains Mono', monospace" font-size="12" fill="#484f58">&#x2192;</text>

      <!-- Pulsing dot 2 -->
      <circle cx="105" cy="-4" r="3" fill="#e3b341" filter="url(#glow)">
        <animate attributeName="opacity" values="0.3;0.9;0.3" dur="2s" begin="0.3s" repeatCount="indefinite"/>
      </circle>
      <text x="117" font-family="'SF Mono', 'Fira Code', 'Cascadia Code', 'JetBrains Mono', monospace" font-size="12" fill="#8b949e">signals.jsonl</text>

      <text x="245" font-family="'SF Mono', 'Fira Code', 'Cascadia Code', 'JetBrains Mono', monospace" font-size="12" fill="#484f58">&#x2192;</text>

      <!-- Pulsing dot 3 -->
      <circle cx="268" cy="-4" r="3" fill="#f0883e" filter="url(#glow)">
        <animate attributeName="opacity" values="0.3;0.9;0.3" dur="2s" begin="0.6s" repeatCount="indefinite"/>
      </circle>
      <text x="280" font-family="'SF Mono', 'Fira Code', 'Cascadia Code', 'JetBrains Mono', monospace" font-size="12" fill="#8b949e">manifest</text>

      <text x="360" font-family="'SF Mono', 'Fira Code', 'Cascadia Code', 'JetBrains Mono', monospace" font-size="12" fill="#484f58">&#x2192;</text>

      <!-- Pulsing dot 4 -->
      <circle cx="383" cy="-4" r="3" fill="#e3b341" filter="url(#glow)">
        <animate attributeName="opacity" values="0.3;0.9;0.3" dur="2s" begin="0.9s" repeatCount="indefinite"/>
      </circle>
      <text x="395" font-family="'SF Mono', 'Fira Code', 'Cascadia Code', 'JetBrains Mono', monospace" font-size="12" fill="#8b949e">step-plan</text>

      <text x="490" font-family="'SF Mono', 'Fira Code', 'Cascadia Code', 'JetBrains Mono', monospace" font-size="12" fill="#484f58">&#x2192;</text>

      <!-- Pulsing dot 5 -->
      <circle cx="513" cy="-4" r="3" fill="#f0883e" filter="url(#glow)">
        <animate attributeName="opacity" values="0.3;0.9;0.3" dur="2s" begin="1.2s" repeatCount="indefinite"/>
      </circle>
      <text x="525" font-family="'SF Mono', 'Fira Code', 'Cascadia Code', 'JetBrains Mono', monospace" font-size="12" fill="#f0f6fc" font-weight="bold">LANDED.md</text>
    </g>

    <!-- Corner badge -->
    <g transform="translate(830, 15)">
      <rect width="55" height="22" rx="11" fill="#f0883e" fill-opacity="0.15" stroke="#f0883e" stroke-width="0.8" opacity="0.8"/>
      <text x="27.5" y="15" font-family="'SF Mono', 'Fira Code', 'Cascadia Code', 'JetBrains Mono', monospace" font-size="11" fill="#f0883e" text-anchor="middle" opacity="0.9">v0.0.1</text>
    </g>

    <!-- Outer border -->
    <rect width="900" height="220" rx="12" fill="none" stroke="#f0883e" stroke-width="0.5" opacity="0.1"/>
  </g>
</svg>