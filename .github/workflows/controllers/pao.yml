name: "PAO — Public Affairs Dispatch"

on:
  workflow_dispatch:
    inputs:
      mission_id:
        description: "Mission ID"
        required: true
        type: string
      phase:
        description: "Phase number"
        required: true
        type: string
        default: "6"

permissions:
  contents: read

jobs:
  pao:
    name: "PAO dispatch"
    runs-on: ubuntu-latest
    steps:
      - name: Generate taem-flight App token
        id: app-token
        uses: tibdex/github-app-token@v2
        with:
          app_id: ${{ secrets.TAEM_APP_ID }}
          private_key: ${{ secrets.TAEM_APP_PRIVATE_KEY }}

      - name: Dispatch to fabric-social
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          curl -s -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/ry-ops/fabric-social/dispatches" \
            -d "{\"event_type\":\"taem-mission-landed\",\"client_payload\":{\"mission_id\":\"${{ inputs.mission_id }}\",\"phase\":\"${{ inputs.phase }}\"}}" \
            || echo "PAO dispatch failed (non-fatal)"
