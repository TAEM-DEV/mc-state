name: "NAV — Integration Map Builder"

on:
  workflow_dispatch:
    inputs:
      mission_id:
        description: "Mission ID"
        required: true
        type: string
      phase:
        description: "Phase number"
        required: true
        type: string
        default: "1"
      repos:
        description: "Comma-separated repos to scan"
        required: true
        type: string

permissions:
  contents: write

jobs:
  nav:
    name: "NAV corpus ingestion"
    runs-on: ubuntu-latest
    steps:
      - name: Generate taem-flight App token
        id: app-token
        uses: tibdex/github-app-token@v2
        with:
          app_id: ${{ secrets.TAEM_APP_ID }}
          private_key: ${{ secrets.TAEM_APP_PRIVATE_KEY }}

      - name: Checkout mc-state
        uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Configure git
        run: |
          git config user.name "taem-flight[bot]"
          git config user.email "flight@taem-dev.github.io"

      - name: Create mission directory
        run: mkdir -p "missions/${{ inputs.mission_id }}"

      - name: Build integration map
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          python3 scripts/build_integration_map.py \
            --mission-id "${{ inputs.mission_id }}" \
            --mission-dir "missions/${{ inputs.mission_id }}" \
            --repos "${{ inputs.repos }}" \
            --gh-token "$GH_TOKEN"

      - name: Commit and push integration map
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git add "missions/${{ inputs.mission_id }}/integration-map.json"
          git diff --cached --quiet && echo "nothing to commit" && exit 0
          git remote set-url origin https://x-access-token:${GH_TOKEN}@github.com/TAEM-DEV/mc-state.git
          git commit -m "taem: NAV integration-map for ${{ inputs.mission_id }}"
          git pull --rebase origin main
          git push origin main
          exit 0
          git remote set-url origin https://x-access-token:${GH_TOKEN}@github.com/TAEM-DEV/mc-state.git
          git push origin main

      - name: Append NAV GO signal
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git remote set-url origin https://x-access-token:${GH_TOKEN}@github.com/TAEM-DEV/mc-state.git
          python3 scripts/append_signal.py \
            --mission-id "${{ inputs.mission_id }}" \
            --mission-dir "missions/${{ inputs.mission_id }}" \
            --controller NAV \
            --phase ${{ inputs.phase }} \
            --signal GO \
            --reason "Integration map built and committed"
